<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Booking Simulator · Acceso</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="brand-row">
      <span class="brand-row__icon">&#9992;</span>
      <span class="brand-row__title" style="font-size:18px">Flight Booking Simulator</span>
    </div>

    <!-- Huecos para los logos oficiales de HPE y Zerto — ver assets/logos/README.md -->
    <div class="partner-logos">
      <img src="assets/logos/hpe-logo.svg" alt="HPE" onerror="this.style.display='none'">
      <img src="assets/logos/zerto-logo.svg" alt="Zerto" onerror="this.style.display='none'">
    </div>

    <h1>Acceso</h1>

    <form id="loginForm" class="form">
      <label>
        Usuario
        <input type="text" id="username" autocomplete="username" required>
      </label>

      <label>
        Contraseña
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar contraseña">&#128065;</button>
        </div>
      </label>

      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      <p id="loginMessage" class="form-message"></p>
    </form>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
