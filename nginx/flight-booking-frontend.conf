server {
    listen 80;
    server_name _;

    root /var/www/flight-booking-frontend;
    index index.html;

    # Frontend estático (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend (FastAPI + Gunicorn en la VM de backend).
    # Sustituye BACKEND_HOST por la IP/hostname real de esa VM.
    location /api/ {
        proxy_pass http://BACKEND_HOST:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Cache ligera para estáticos
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
